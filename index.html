<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PieFolio - 投資助手</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>
<body>
    <!-- App Header -->
    <header class="app-header">
        <div class="user-greet">
            <h2>Hey, Investor! 👋</h2>
            <p>Good morning!</p>
        </div>
        <div class="profile-icon">
            <img src="https://i.pravatar.cc/100?u=investor" alt="Profile">
        </div>
    </header>

    <main class="container">
        <!-- 1. 資產概況分頁 -->
        <section id="page-dashboard" class="page-section active">
            <!-- Total Value -->
            <div class="total-value-card">
                <span class="label">Current Value</span>
                <div class="value" id="totalValue">$0</div>
                <div class="change" id="profitRatio" style="background: var(--accent-mint); color: var(--color-down);">+0.00% (+$0)</div>
            </div>

            <!-- Quick Actions -->
            <div class="quick-actions">
                <button class="action-btn primary" onclick="openAddAssetModal()">
                    <span class="nav-icon">➕</span> Add Asset
                </button>
                <button class="action-btn" onclick="switchTab('page-dividend')">
                    <span class="nav-icon">📊</span> Analysis
                </button>
            </div>

            <!-- Charts Card (Dark Mode) -->
            <div class="chart-card">
                <div class="section-header" style="margin-bottom: 20px;">
                    <h3 style="color: white;">Portfolio Stats</h3>
                    <select id="groupSelect" style="background: transparent; color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; padding: 4px 8px;">
                        <option value="all">All Assets</option>
                    </select>
                </div>
                <div class="charts-grid">
                    <div class="chart-container-item" id="portfolioMacroPie"></div>
                    <div class="chart-container-item" id="portfolioTagPie"></div>
                    <div class="chart-container-item" id="portfolioHeatmap"></div>
                </div>
                <div style="text-align: center; font-size: 0.8rem; color: #9ca3af; margin-top: 10px;">Swipe to see more →</div>
            </div>

            <!-- Asset List -->
            <div class="section-header">
                <h3>My Assets</h3>
                <a href="#" class="view-all">View All</a>
            </div>
            <div id="assetCardsContainer">
                <!-- Assets will be rendered here as cards -->
            </div>
        </section>

        <!-- 2. 股息試算分頁 -->
        <section id="page-dividend" class="page-section">
            <div class="total-value-card">
                <span class="label">Estimated Dividend</span>
                <div class="value" id="totalDividendOutput">$0</div>
                <p style="color: var(--text-secondary);">Your annual passive income forecast.</p>
            </div>
            <!-- Dividend components go here -->
            <div id="dividendCalcArea"></div>
        </section>

        <!-- 3. 設定分頁 -->
        <section id="page-settings" class="page-section">
            <div class="user-greet" style="margin-bottom: 24px;">
                <p>Settings</p>
            </div>
            <div class="asset-card purple">
                <div class="asset-info">
                    <div class="asset-logo">💾</div>
                    <div class="asset-details">
                        <span class="name">Data Backup</span>
                        <span class="code">Export/Import your data</span>
                    </div>
                </div>
            </div>
            <div class="asset-card mint">
                <div class="asset-info">
                    <div class="asset-logo">🔐</div>
                    <div class="asset-details">
                        <span class="name">Privacy Mode</span>
                        <span class="code">Data stays on your device</span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Floating Bottom Navigation -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('page-dashboard', this)">
            <span class="nav-icon">📈</span>
        </div>
        <div class="nav-item center" onclick="openAddAssetModal()">
            <span class="nav-icon">➕</span>
        </div>
        <div class="nav-item" onclick="switchTab('page-settings', this)">
            <span class="nav-icon">⚙️</span>
        </div>
    </nav>

    <!-- Modal: Add/Edit Asset -->
    <div class="modal-overlay" id="addAssetModal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                <h2 id="modalTitle" style="margin: 0; font-size: 1.4rem;">Add Asset</h2>
                <button onclick="closeModal()" style="background: none; border: none; font-size: 1.5rem;">&times;</button>
            </div>
            <form id="addAssetForm" style="display: flex; flex-direction: column; gap: 20px;">
                <div style="display: flex; gap: 12px;">
                    <input type="text" id="assetName" required placeholder="Name (e.g. Apple)" style="flex: 2; padding: 14px; border-radius: 16px; border: 1px solid #e2e8f0;">
                    <input type="text" id="assetCode" required placeholder="Code" style="flex: 1; padding: 14px; border-radius: 16px; border: 1px solid #e2e8f0;">
                </div>
                <div style="display: flex; gap: 12px;">
                    <select id="assetMacro" style="flex: 1; padding: 14px; border-radius: 16px; border: 1px solid #e2e8f0;"></select>
                    <input type="text" id="assetTag" placeholder="Tag" style="flex: 1; padding: 14px; border-radius: 16px; border: 1px solid #e2e8f0;">
                </div>
                <div style="display: flex; gap: 12px;">
                    <input type="number" id="assetShares" required placeholder="Shares" style="flex: 1; padding: 14px; border-radius: 16px; border: 1px solid #e2e8f0;">
                    <input type="number" id="assetCost" required placeholder="Cost" style="flex: 1; padding: 14px; border-radius: 16px; border: 1px solid #e2e8f0;">
                </div>
                <input type="number" id="assetPrice" required placeholder="Current Price" style="padding: 14px; border-radius: 16px; border: 1px solid #e2e8f0;">
                <button type="submit" class="action-btn primary" style="width: 100%; padding: 18px;">Save Asset</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
