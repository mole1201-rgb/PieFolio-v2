<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>存股理財小幫手</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>

<body>
    <div class="app-container">
        <!-- 側邊選單 -->
        <aside class="sidebar">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent-color)"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="1" x2="12" y2="23"></line>
                    <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                </svg>
                存股小幫手
            </div>
            
            <div style="margin-top: -24px; margin-bottom: 24px; padding: 6px 10px; background: rgba(16, 185, 129, 0.1); border-radius: 6px; border: 1px solid rgba(16, 185, 129, 0.2); display: flex; align-items: center; gap: 8px;">
                <div style="width: 8px; height: 8px; background: #10b981; border-radius: 50%; box-shadow: 0 0 8px #10b981;"></div>
                <span style="font-size: 0.75rem; color: #34d399; font-weight: 500;">🔒 本地資料加密儲存</span>
            </div>

            <div class="nav-menu">
                <div class="nav-item active">資產概況</div>
                <div class="nav-item">股息試算器</div>
                <div class="nav-item">設定</div>
            </div>
        </aside>

        <!-- 主內容區塊 -->
        <main class="main-content">
            <header>
                <div>
                    <h1>資產概況</h1>
                    <p class="subtitle">即時掌握您的投資績效與資產變化</p>
                </div>
                <div class="group-select-wrapper">
                    <select id="groupSelect">
                        <option value="all">所有部位</option>
                    </select>
                </div>
            </header>

            <!-- 1. 資產概況分頁 -->
            <section id="page-dashboard" class="page-section active">
                <div class="kpi-grid">
                    <div class="glass-panel kpi-card">
                        <div class="kpi-title">總市值 (Total Value)</div>
                        <div class="kpi-value" id="totalValue">TWD 0</div>
                        <div class="kpi-change up" id="totalValueChange">+0% 較昨日</div>
                    </div>
                    <div class="glass-panel kpi-card">
                        <div class="kpi-title">未實現損益 (Unrealized P/L)</div>
                        <div class="kpi-value" id="totalProfit">+$0</div>
                        <div class="kpi-change up" id="profitRatio">+0% 總報酬率</div>
                    </div>
                </div>

                <!-- 圖表區 -->
                <div class="glass-panel" style="padding: 24px; margin-bottom: 24px;">
                    <div class="charts-carousel">
                        <div class="carousel-item">
                            <div style="text-align: center; font-weight: 600; margin-bottom: 12px;">🎯 核心策略分佈</div>
                            <div id="portfolioMacroPie" style="width: 100%; height: 320px;"></div>
                        </div>
                        <div class="carousel-item">
                            <div style="text-align: center; font-weight: 600; margin-bottom: 12px;">🏷️ 產業屬性分佈</div>
                            <div id="portfolioTagPie" style="width: 100%; height: 320px;"></div>
                        </div>
                        <div class="carousel-item">
                            <div style="text-align: center; font-weight: 600; margin-bottom: 12px;">🗺️ 資產熱力圖</div>
                            <div id="portfolioHeatmap" style="width: 100%; height: 320px;"></div>
                        </div>
                    </div>
                </div>

                <!-- 持股明細 -->
                <div class="glass-panel" style="padding: 24px; overflow-x: auto;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <h2 style="margin: 0; font-size: 1.25rem;">持股明細</h2>
                        <button class="btn-primary" id="addAssetBtn">+ 新增標的</button>
                    </div>
                    <table class="assets-table">
                        <thead>
                            <tr>
                                <th>標的名稱</th>
                                <th>持有股數</th>
                                <th>成交均價</th>
                                <th>現價</th>
                                <th>總市值</th>
                                <th>未實現損益</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="assetTableBody"></tbody>
                    </table>
                </div>
            </section>

            <!-- 2. 股息試算分頁 -->
            <section id="page-dividend" class="page-section">
                <div class="glass-panel" style="padding: 24px;">
                    <h2>股息試算器</h2>
                    <p>此區塊內容載入中...</p>
                </div>
            </section>

            <!-- 3. 設定分頁 -->
            <section id="page-settings" class="page-section">
                <div class="glass-panel" style="padding: 24px;">
                    <h2>系統設定</h2>
                    <p>管理您的自定義策略與標籤。</p>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal: 新增/編輯標的 -->
    <div class="modal-overlay" id="addAssetModal">
        <div class="glass-panel modal-content" style="max-width: 550px; width: 90%; background: #1e2128; padding: 30px; border-radius: 16px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 16px;">
                <h2 id="modalTitle" style="margin: 0; font-size: 1.25rem;">新增投資標的</h2>
                <button class="close-btn" id="closeModalBtn" style="background:none; border:none; color:#94a3b8; font-size: 1.5rem; cursor:pointer;">&times;</button>
            </div>
            <form id="addAssetForm" style="display: flex; flex-direction: column; gap: 16px;">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div style="display: flex; flex-direction: column; gap: 8px;">
                        <label style="font-size: 0.9rem; color: #94a3b8;">標的名稱</label>
                        <input type="text" id="assetName" required style="background:rgba(0,0,0,0.2); border:1px solid rgba(255,255,255,0.1); color:#fff; padding:10px; border-radius:6px;">
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 8px;">
                        <label style="font-size: 0.9rem; color: #94a3b8;">股票代碼</label>
                        <input type="text" id="assetCode" required style="background:rgba(0,0,0,0.2); border:1px solid rgba(255,255,255,0.1); color:#fff; padding:10px; border-radius:6px;">
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div style="display: flex; flex-direction: column; gap: 8px;">
                        <label style="font-size: 0.9rem; color: #94a3b8;">核心策略</label>
                        <select id="assetMacro" style="background:rgba(0,0,0,0.2); border:1px solid rgba(255,255,255,0.1); color:#fff; padding:10px; border-radius:6px;"></select>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 8px;">
                        <label style="font-size: 0.9rem; color: #94a3b8;">產業標籤</label>
                        <input type="text" id="assetTag" style="background:rgba(0,0,0,0.2); border:1px solid rgba(255,255,255,0.1); color:#fff; padding:10px; border-radius:6px;">
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div style="display: flex; flex-direction: column; gap: 8px;">
                        <label style="font-size: 0.9rem; color: #94a3b8;">持有股數</label>
                        <input type="number" id="assetShares" required style="background:rgba(0,0,0,0.2); border:1px solid rgba(255,255,255,0.1); color:#fff; padding:10px; border-radius:6px;">
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 8px;">
                        <label style="font-size: 0.9rem; color: #94a3b8;">成交均價</label>
                        <input type="number" id="assetCost" required step="0.01" style="background:rgba(0,0,0,0.2); border:1px solid rgba(255,255,255,0.1); color:#fff; padding:10px; border-radius:6px;">
                    </div>
                </div>
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <label style="font-size: 0.9rem; color: #94a3b8;">目前現價</label>
                    <input type="number" id="assetPrice" required step="0.01" style="background:rgba(0,0,0,0.2); border:1px solid rgba(255,255,255,0.1); color:#fff; padding:10px; border-radius:6px;">
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px;">
                    <button type="button" class="btn-secondary" id="cancelModalBtn" style="background:rgba(255,255,255,0.1); border:none; color:#fff; padding:10px 20px; border-radius:6px; cursor:pointer;">取消</button>
                    <button type="submit" class="btn-primary" style="background:var(--accent-color); border:none; color:#fff; padding:10px 20px; border-radius:6px; cursor:pointer;">儲存標的</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
